site_name: pyinfra
site_description: Configuration-driven Linux infrastructure and workstation automation for Debian and Ubuntu.
site_url: https://gpkvt.github.io/pyinfra/
repo_url: https://github.com/gpkvt/pyinfra
repo_name: gpkvt/pyinfra
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
  palette:
    - scheme: slate
      primary: teal
      accent: teal

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/collapsible-state.js

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Configuration: configuration.md
  - Deployment: deployment.md
  - Tasks: tasks.md
  - Docker: docker.md
  - Secrets: secrets.md
  - System: system.md
  - Samba: samba.md
  - Templates: templates.md
  - Development: development.md
