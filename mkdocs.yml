---
site_name: gpkvt/pyinfra
site_description: Deployment configuration and task modules using upstream pyinfra.
site_url: https://gpkvt.github.io/pyinfra/
repo_url: https://github.com/gpkvt/pyinfra
repo_name: gpkvt/pyinfra
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css
  - stylesheets/task-hub.css

extra_javascript:
  - javascripts/collapsible-state.js

markdown_extensions:
  - md_in_html
  - admonition
  - attr_list
  - def_list
  - footnotes
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

nav:
  - Overview: index.md
  - Tasks: tasks-overview.md
  - Docker: docker.md
  - Configuration: configuration.md
  - Deployment: deployment.md
  - Reference:
      - Feature reference: feature-reference.md
      - Task reference: tasks.md
      - Architecture: architecture.md
      - System: system.md
      - Samba: samba.md
      - Templates: templates.md
  - Project:
      - Upstream pyinfra: upstream.md
      - Pyinfra Manager: pyinfra-manager.md
      - Secrets: secrets.md
      - Development: development.md
      - Changelog: changelog.md
