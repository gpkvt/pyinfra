---
name: CI

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: Run pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Validate task and utility coverage
        run: |
          python -m compileall -q tasks files/scripts/translate.py
          bash -n files/dehydrated_hook.sh
          while IFS= read -r script; do
            bash -n "$script"
          done < <(
            find files/scripts -type f \
              ! -name '*.py' \
              ! -path '*/__pycache__/*' \
              -print | sort
          )

  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .pre-commit-config.yaml

      - name: Install pre-commit and yamllint
        run: |
          python -m pip install --upgrade pip
          python -m pip install pre-commit yamllint

      - name: Validate pre-commit configuration
        run: pre-commit validate-config

      - name: Run pre-commit hooks
        if: always()
        run: |
          pre-commit run --all-files \
            --verbose \
            --show-diff-on-failure

  cosmic-app:
    name: Check COSMIC desktop application
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libexpat1-dev libfontconfig-dev libfreetype-dev \
            libxkbcommon-dev libwayland-dev pkg-config

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/pyinfra-manager

      - name: Check Rust formatting
        run: >-
          cargo fmt --manifest-path apps/pyinfra-manager/Cargo.toml
          --all -- --check

      - name: Run Clippy
        run: >-
          cargo clippy --manifest-path apps/pyinfra-manager/Cargo.toml
          --all-targets -- -D warnings

      - name: Check COSMIC application
        run: >-
          cargo check --manifest-path apps/pyinfra-manager/Cargo.toml
          --all-targets

  idempotency:
    name: Check deployment idempotency
    needs:
      - pytest
      - pre-commit
    # Run after both prerequisite jobs finish, even if either one failed,
    # so deployment failures and idempotency problems are still reported.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install deployment dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run deployment for the first time
        run: |
          pyinfra .github/ci/inventory.py deploy.py --diff \
            --group-data .github/ci/group_data \
            --limit @local --json --yes \
            > first-run.json

      - name: Verify Docker smoke container is running
        run: |
          container_id="$(
            docker compose -f \
              "$HOME/.docker/ci-smoke/docker-compose.yml" ps -q smoke
          )"
          test -n "$container_id"
          running="$(
            docker inspect --format '{{.State.Running}}' "$container_id"
          )"
          test "$running" = "true"

      - name: Run deployment again and check for changes
        run: |
          pyinfra .github/ci/inventory.py deploy.py --diff \
            --group-data .github/ci/group_data \
            --limit @local --json --yes \
            > second-run.json

          python - <<'PY'
          import json
          from pathlib import Path

          raw_output = Path("second-run.json").read_text()
          decoder = json.JSONDecoder()
          json_start = raw_output.find("{")

          if json_start < 0:
              raise SystemExit(
                  "pyinfra did not emit a JSON result object; "
                  f"stdout begins with {raw_output[:200]!r}"
              )

          try:
              payload, json_end = decoder.raw_decode(raw_output, json_start)
          except json.JSONDecodeError as error:
              raise SystemExit(
                  "Could not parse pyinfra JSON results; "
                  f"stdout begins with {raw_output[:200]!r}"
              ) from error

          if raw_output[json_start + json_end:].strip():
              raise SystemExit(
                  "Unexpected trailing output after pyinfra JSON results: "
                  f"{raw_output[json_start + json_end:][:200]!r}"
              )

          results = payload.get("results")
          if not isinstance(results, dict):
              raise SystemExit("pyinfra did not return deployment results")

          totals = results.get("totals")
          if not isinstance(totals, dict):
              raise SystemExit(
                  "pyinfra results do not contain operation totals"
              )

          changed = totals.get("success")
          errors = totals.get("error")
          failed_hosts = results.get("failed_hosts")

          if not isinstance(changed, int) or not isinstance(errors, int):
              raise SystemExit(
                  "pyinfra results contain invalid operation totals"
              )

          if errors or failed_hosts:
              raise SystemExit(
                  "Second deployment failed: "
                  + str(errors)
                  + " failed operation(s); failed hosts: "
                  + str(failed_hosts)
              )

          if changed:
              raise SystemExit(
                  "Deployment is not idempotent: second run changed "
                  + str(changed)
                  + " operation(s)."
              )

          print("Deployment is idempotent: second run made no changes.")
          PY

      - name: Verify Docker smoke container remains running
        run: |
          container_id="$(
            docker compose -f \
              "$HOME/.docker/ci-smoke/docker-compose.yml" ps -q smoke
          )"
          test -n "$container_id"
          running="$(
            docker inspect --format '{{.State.Running}}' "$container_id"
          )"
          test "$running" = "true"
