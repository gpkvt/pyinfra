---
name: Release

'on':
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic-version tag to release (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Validate version tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version_pattern='^v[0-9]+\.[0-9]+\.[0-9]+'
          version_pattern+='(-[0-9A-Za-z.-]+)?'
          version_pattern+='(\+[0-9A-Za-z.-]+)?'
          version_pattern+='$'
          if [[ ! "$RELEASE_TAG" =~ $version_pattern ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            echo "Expected vMAJOR.MINOR.PATCH with optional metadata." >&2
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --generate-notes \
            --title "$RELEASE_TAG"
