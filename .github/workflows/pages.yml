---
name: GitHub Pages

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - '.github/workflows/pages.yml'
      - 'tests/test_pages_workflow.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    pages-${{ github.event_name == 'pull_request' &&
    format('pr-{0}', github.event.pull_request.number) || 'publish' }}
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install documentation dependencies
        run: python -m pip install --upgrade pip mkdocs-material

      - name: Build HTML
        run: mkdocs build --strict

      - name: Upload generated site
        uses: actions/upload-artifact@v6
        with:
          name: documentation-site
          path: site/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish documentation
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download generated site
        uses: actions/download-artifact@v6
        with:
          name: documentation-site
          path: site/

      - name: Delete previous gh-pages branch
        shell: bash
        run: |
          set +e
          git ls-remote --exit-code --heads origin gh-pages >/dev/null
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            git push origin --delete gh-pages
          elif [ "$status" -eq 2 ]; then
            echo "gh-pages does not exist; nothing to delete."
          else
            echo "Unable to inspect the gh-pages branch (exit $status)." >&2
            exit "$status"
          fi

      - name: Publish HTML to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
          force_orphan: true
