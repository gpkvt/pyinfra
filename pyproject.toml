[project]
name = "pyinfra-repo"
version = "0.1.0"
description = "A configuration-driven automation repository built on pyinfra."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "annotated-types==0.8.0",
    "attrs==26.1.0",
    "bcrypt==5.0.0",
    "cffi==2.1.1",
    "cryptography==50.0.2",
    "cyclopts==4.25.3",
    "distro==1.9.0",
    "docstring-parser==0.18.0",
    "gevent==26.9.0",
    "greenlet==3.5.6",
    "invoke==3.0.3",
    "jinja2==3.1.6",
    "markdown-it-py==4.2.0",
    "markupsafe==3.0.4",
    "mdurl==0.1.2",
    "packaging==26.3",
    "paramiko==5.1.0",
    "pip==26.2",
    "pycparser==3.12",
    "pydantic-core==2.50.4",
    "pydantic==2.14.3",
    "pygments==2.21.0",
    "pyinfra==3.11.0",
    "pynacl==1.6.2",
    "python-dateutil==2.9.0.post0",
    "rich-rst==2.2.0",
    "rich==15.0.0",
    "six==1.17.0",
    "typeguard==4.6.0",
    "types-paramiko==5.1.0.20261030",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.5",
    "zope-event==6.2",
    "zope-interface==8.7",
]

[dependency-groups]
dev = [
    "deptry",
    "pytest",
    "pytest-cov",
    "pre-commit",
]
