---
repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=2000]
      - id: check-yaml
      - id: check-json
      - id: pretty-format-json
        args: [--autofix, --indent=2]
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict

  # Python linting
  - repo: https://github.com/PyCQA/pylint
    rev: v3.3.7
    hooks:
      - id: pylint
        args:
          # - --errors-only
          - --disable=E0401,E0602,C0301,W0105,C0116,R0903,R0801,C0115,C0103
        files: '\.py$'

  # YAML linting
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
        args: [-s]

  # JSON linting
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: pretty-format-json
        name: jsonlint
        args: [--autofix]
        types: [json]
